# methyltfr_bioc324 -- R 4.6 / Bioconductor 3.24 (devel)
#
# Purpose: an environment in which the Bioconductor submissions
# (methylTFRAnnotationHg38, methylTFRAnnotationMm10) can actually be
# tested. The records AH122289-AH122303 live on the DEVEL hub only, and
# the annotation metadata declares BiocVersion 3.24, so nothing older
# than Bioc devel can see them.
#
# This does NOT replace mtfr.yaml. Keep that one pinned at R 4.3 /
# Bioc 3.17 for the manuscript analyses.
#
# Usage:
#   mamba env create -f mtfr_bioc324.yaml
#   conda activate methyltfr_bioc324
#   Rscript bootstrap_bioc324.R
#   Rscript test_annotation_pkgs.R

name: methyltfr_bioc324

channels:
  - conda-forge

dependencies:
  - r-base=4.6.*

  # toolchain -- everything R-level is built from source
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - pkg-config
  - git

  # system libraries the source builds link against
  - curl
  - libcurl
  - openssl
  - libxml2
  - zlib
  - bzip2
  - xz
  - pcre2
  - libdeflate
  - hdf5
  - gsl
  - glpk
  - libgit2

  # graphics stack (ragg / systemfonts / textshaping, pulled in by devtools)
  - libpng
  - libjpeg-turbo
  - libtiff
  - freetype
  - fontconfig
  - harfbuzz
  - fribidi
  - cairo

  # vignette rendering
  - pandoc
